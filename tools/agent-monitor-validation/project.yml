name: AgentMonitorValidation
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  ProsioKit:
    path: ../../Packages/ProsioKit
targets:
  AgentMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../../Apps/macOS/Prosio/Agents
      - path: Tests
  AgentAcceptancePreview:
    type: application
    platform: macOS
    sources:
      - path: ../../Apps/macOS/Prosio/Agents
      - path: ../../Apps/macOS/Prosio/UI/MenuBar/MenuBarShell.swift
      - path: Preview.swift
    dependencies:
      - package: ProsioKit
        product: ProsioAudio
      - package: ProsioKit
        product: ProsioCore
      - package: ProsioKit
        product: ProsioTranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.prosio.agent-acceptance
    info:
      path: Preview-Info.plist
      properties:
        CFBundleName: Prosio Agent Acceptance
        NSMicrophoneUsageDescription: Record only when you explicitly start a task-bound voice reply.
        NSSpeechRecognitionUsageDescription: Transcribe task-bound voice replies locally.
schemes:
  AgentMonitorValidation:
    build:
      targets:
        AgentMonitorTests: [test]
    test:
      targets:
        - AgentMonitorTests
