name: Prosio
options:
  bundleIdPrefix: app.prosio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  ProsioKit:
    path: Packages/ProsioKit
targets:
  Prosio:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/Prosio
        excludes:
          - "Resources/Info.plist"
          - "Resources/Prosio.entitlements"
    dependencies:
      - package: ProsioKit
        product: ProsioCore
      - package: ProsioKit
        product: ProsioAudio
      - package: ProsioKit
        product: ProsioTranscription
    info:
      path: Apps/macOS/Prosio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Prosio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Prosio listens only while you hold the dictation key, to turn your speech into text.
        NSSpeechRecognitionUsageDescription: Prosio uses on-device speech recognition when you are offline or in private mode.
    entitlements:
      path: Apps/macOS/Prosio/Resources/Prosio.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.prosio.mac
        PRODUCT_NAME: Prosio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  ProsioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/macOS/ProsioTests
    dependencies:
      - target: Prosio
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prosio.app/Contents/MacOS/Prosio"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Prosio:
    build:
      targets:
        Prosio: all
        ProsioTests: [test]
    test:
      config: Debug
      targets:
        - ProsioTests
    run:
      config: Debug
