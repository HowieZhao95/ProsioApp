name: Prosio
options:
  bundleIdPrefix: app.prosio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  ProsioKit:
    path: Packages/ProsioKit
targets:
  Prosio:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/Prosio
        excludes:
          - "Resources/Info.plist"
          - "Resources/Prosio.entitlements"
          - "Resources/Prosio.Release.entitlements"
          - "Notes/Editor"
      - path: Apps/macOS/Prosio/Notes/Editor/NotesEditor
        type: folder
        name: NotesEditor
        buildPhase: resources
    dependencies:
      - package: ProsioKit
        product: ProsioCore
      - package: ProsioKit
        product: ProsioAudio
      - package: ProsioKit
        product: ProsioTranscription
      - package: ProsioKit
        product: ProsioMeeting
      - sdk: AVKit.framework
    info:
      path: Apps/macOS/Prosio/Resources/Info.plist
      properties:
        ProsioBackendURL: $(PROSIO_BACKEND_URL)
        CFBundleDisplayName: Prosio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Prosio 读取系统节假日日历，在便签月历中显示节日名称，不创建或修改日历事件。
        NSMicrophoneUsageDescription: 用于语音输入、录音转写及录屏中的声音。仅在你开始录制时使用。
        NSCameraUsageDescription: 仅在你为录屏选择摄像头时预览与录制画面。
        NSCameraUseContinuityCameraDeviceType: true
        NSSpeechRecognitionUsageDescription: 用于在设备上识别语音，支持离线与私密模式。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.prosio.mac
        PRODUCT_NAME: Prosio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Prosio/Resources/Prosio.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Prosio Local Development" # stable local identity so TCC grants survive rebuilds; see docs/DEV_SIGNING.md
        DEVELOPMENT_TEAM: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Xcode's separate Prosio.debug.dylib fails library validation under the hardened runtime
        # with the self-signed dev identity ("different Team IDs"); link everything into the binary.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/macOS/Prosio/Resources/Prosio.Release.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  ProsioTests:
    type: bundle.unit-test
    platform: macOS
    # Logic-only test bundle, no host application: it never launches (a real, or shared-bundle-id
    # duplicate) `Prosio.app`, which matters because launching anything with bundle id
    # `app.prosio.mac` can terminate an already-running instance of it (observed live). Instead of
    # `@testable import Prosio` (which needs BUNDLE_LOADER/TEST_HOST to dlopen into the app), the
    # handful of pure-logic files under test are compiled directly into this target as plain
    # sources — they have no app-specific dependencies, only Foundation/AppKit/ProsioCore.
    sources:
      - path: Apps/macOS/Prosio/Notes/Domain
      - path: Apps/macOS/Prosio/Notes/Storage
      - path: Apps/macOS/ProsioTests
      - path: Apps/macOS/Prosio/System/HotkeyStateMachine.swift
      - path: Apps/macOS/Prosio/System/HotkeyRouting.swift
      - path: Apps/macOS/Prosio/System/FocusContextProvider.swift
      - path: Apps/macOS/Prosio/System/PracticeTextTarget.swift
      - path: Apps/macOS/Prosio/System/TextInserter.swift
      - path: Apps/macOS/Prosio/UI/Onboarding/OnboardingProgress.swift
      - path: Apps/macOS/Prosio/UI/Onboarding/OnboardingPermissionGuide.swift
      - path: Apps/macOS/Prosio/UI/Onboarding/OnboardingPracticeEditor.swift
      - path: Apps/macOS/Prosio/System/ProsioLog.swift
      - path: Apps/macOS/Prosio/Capture/Domain
      - path: Apps/macOS/Prosio/Capture/Platform
      - path: Apps/macOS/Prosio/Capture/Screenshot
      - path: Apps/macOS/Prosio/Capture/Interaction
      - path: Apps/macOS/Prosio/Capture/Snapping
      - path: Apps/macOS/Prosio/Capture/Editing
      - path: Apps/macOS/Prosio/Capture/Integration/CaptureEditingSession.swift
      - path: Apps/macOS/Prosio/UI/Editor
      - path: Apps/macOS/Prosio/Capture/Storage
      - path: Apps/macOS/Prosio/Meeting/MeetingStore.swift
      - path: Apps/macOS/Prosio/Presentation/Domain
      - path: Apps/macOS/Prosio/Presentation/Platform/PresentationClock.swift
      - path: Apps/macOS/Prosio/Presentation/Platform/AwakeService.swift
      - path: Apps/macOS/Prosio/Presentation/Platform/PresentationInputMonitor.swift
      - path: Apps/macOS/Prosio/Presentation/Platform/PresentationOverlays.swift
      - path: Apps/macOS/Prosio/Recording
      - path: Apps/macOS/Prosio/UI/Recording
      - path: Apps/macOS/Prosio/System/PermissionsManager.swift
    dependencies:
      - package: ProsioKit
        product: ProsioCore
      - sdk: AVKit.framework
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Prosio Local Development" # stable local identity so TCC grants survive rebuilds; see docs/DEV_SIGNING.md
        DEVELOPMENT_TEAM: ""
schemes:
  Prosio:
    build:
      targets:
        Prosio: all
        ProsioTests: [test]
    test:
      config: Debug
      targets:
        - ProsioTests
    run:
      config: Debug
  ProsioValidation:
    build:
      targets:
        ProsioTests: [test]
    test:
      config: Debug
      targets:
        - ProsioTests
