<main><header><div><small>PROSIO / MENU STUDY</small><h1>两个功能，一套清楚的入口。</h1><p>语音与截图各有归属。设置退后，动作靠前。三版沿用同一套柔和悬浮视觉。</p></div><aside>设计确认稿 · 尚未应用到原生菜单<br>点击任一方案体验浅深主题与聆听状态</aside></header><div class="grid">
<a class="choice" href="a.html"><h2>A · 双区同屏<span class="tag">推荐</span></h2><p>语音、截图上下分组，打开即看见两种能力。<br>无需切换，功能归属最直观。</p><div class="preview"><img src="a-menu.png" alt="A 双区同屏菜单预览"></div></a>
<a class="choice" href="b.html"><h2>B · 标签切换</h2><p>语音、截图各有专属页面与记录。<br>当前功能更聚焦，切换多一步。</p><div class="preview"><img src="b-menu.png" alt="B 标签切换菜单预览"></div></a>
<a class="choice" href="c.html"><h2>C · 极简展开</h2><p>先看两行入口，偏好与最近记录按需展开。<br>体积最小，二级内容需要点击。</p><div class="preview"><img src="c-menu.png" alt="C 极简展开菜单预览"></div></a>
