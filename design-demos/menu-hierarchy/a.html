<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prosio · 菜单方向 A · 双区同屏</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body {
      --page: #202126; --page-text: #d3d4db;
      --surface: #2c2d33; --surface-top: #313238; --surface-raised: #363840;
      --text: #f3f4f7; --muted: #aeb0bb; --quiet: #8d909d;
      --line: #ffffff19; --line-strong: #ffffff26;
      --blue: #7ca8ff; --blue-fill: #547cdd; --blue-fill-hover: #648beb;
      --blue-faint: #7ca8ff1c; --button: #ffffff0c; --button-hover: #ffffff17;
      --shadow: 0 32px 80px #0c0d124b, 0 8px 22px #10111536;
      --outline: #90b3ff;
      margin: 0; min-height: 100vh; background: var(--page); color: var(--page-text);
      display: flex; align-items: center; justify-content: center; padding: 38px 20px;
      -webkit-font-smoothing: antialiased;
    }
    body[data-theme="light"] {
      color-scheme: light;
      --page: #e9ebef; --page-text: #666a75;
      --surface: #fafafc; --surface-top: #ffffff; --surface-raised: #f2f4f8;
      --text: #20232c; --muted: #626774; --quiet: #818693;
      --line: #1b294116; --line-strong: #1b294126;
      --blue: #366ed1; --blue-fill: #4777d6; --blue-fill-hover: #386acb;
      --blue-faint: #4777d619; --button: #1b29410a; --button-hover: #1b294115;
      --shadow: 0 28px 76px #34415a23, 0 8px 22px #33415d16;
      --outline: #315fb8;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--outline); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; }
    svg { width: 17px; height: 17px; display: block; flex: none; }
    .stage { width: min(360px, 100%); }
    .demo-label { color: var(--page-text); text-align: center; font-size: 12px; letter-spacing: .01em; margin: 0 0 14px; }
    .demo-label strong { font-weight: 650; color: inherit; }
    .demo-controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 16px; }
    .segmented { display: inline-flex; gap: 2px; padding: 3px; background: #878b9825; border: 1px solid #ffffff10; border-radius: 9px; }
    .segmented button { border: 0; background: transparent; color: var(--page-text); min-height: 27px; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 560; }
    .segmented button[aria-pressed="true"] { background: var(--surface-top); color: var(--text); box-shadow: 0 1px 4px #00000019; }
    .demo-foot { margin: 13px auto 0; color: var(--page-text); text-align: center; font-size: 11.5px; line-height: 1.5; }
    #menu {
      width: 100%; overflow: hidden; border-radius: 16px; color: var(--text);
      border: 1px solid var(--line-strong); background: var(--surface);
      box-shadow: var(--shadow);
    }
    .menu-header { height: 55px; display: flex; align-items: center; padding: 0 19px; background: var(--surface-top); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 680; letter-spacing: -.018em; }
    .brand-mark { width: 22px; height: 22px; color: var(--blue); }
    .content { padding: 0 18px; }
    .section { padding: 18px 0 15px; }
    .section + .section { border-top: 1px solid var(--line-strong); padding-top: 16px; padding-bottom: 18px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; min-height: 22px; gap: 12px; margin-bottom: 11px; }
    .section-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
    .section-name svg { color: var(--muted); width: 16px; height: 16px; }
    .state { color: var(--quiet); font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .state-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .voice-idle { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--button); }
    .keycap { min-width: 28px; height: 25px; display: inline-grid; place-items: center; padding: 0 5px; border: 1px solid var(--line-strong); background: var(--surface-raised); border-radius: 6px; color: var(--text); font-size: 12px; font-weight: 600; box-shadow: inset 0 -1px var(--line); }
    .voice-idle .instruction { font-size: 13px; color: var(--text); letter-spacing: -.005em; }
    .voice-idle .instruction small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
    .voice-live { display: none; padding: 10px 11px; border: 1px solid #7ca8ff4a; background: var(--blue-faint); border-radius: 10px; }
    body[data-listening="true"] .voice-idle { display: none; }
    body[data-listening="true"] .voice-live { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    body[data-listening="true"] .voice-state { color: var(--blue); }
    .live-left { min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--blue); font-size: 13px; font-weight: 640; }
    .live-waves { display: flex; align-items: center; height: 18px; gap: 2px; }
    .live-waves i { display: block; width: 2px; height: 7px; border-radius: 2px; background: currentColor; animation: breathe 1.1s ease-in-out infinite alternate; }
    .live-waves i:nth-child(2), .live-waves i:nth-child(4) { height: 14px; animation-delay: -.4s; }
    .live-waves i:nth-child(3) { height: 18px; animation-delay: -.2s; }
    @keyframes breathe { to { transform: scaleY(.47); opacity: .64; } }
    .live-actions { display: flex; align-items: center; gap: 5px; flex: none; }
    .live-actions button { border: 0; border-radius: 7px; padding: 6px 9px; color: var(--text); background: var(--button-hover); font-size: 11.5px; font-weight: 620; }
    .live-actions button:first-child { color: var(--blue); background: var(--surface-raised); }
    .live-actions button:hover { filter: brightness(1.09); }
    .subrows { margin-top: 8px; }
    .subrow { width: 100%; min-height: 37px; display: flex; align-items: center; gap: 9px; padding: 6px 3px; border: 0; background: transparent; color: var(--text); text-align: left; border-radius: 7px; font-size: 12.5px; }
    .subrow:hover { background: var(--button-hover); }
    .subrow > svg:first-child { width: 15px; height: 15px; color: var(--muted); margin-left: 2px; }
    .subrow .row-secondary { margin-left: auto; color: var(--quiet); font-size: 11.5px; white-space: nowrap; }
    .subrow .chevron { width: 12px; height: 12px; color: var(--quiet); transition: transform .16s ease; }
    .subrow[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .inline-panel { margin: 1px 3px 6px 26px; padding: 10px 11px; background: var(--button); border: 1px solid var(--line); border-radius: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
    .inline-panel[hidden] { display: none; }
    .inline-panel strong { font-weight: 620; color: var(--text); }
    .panel-note { margin: 0; }
    .choice-row { display: flex; gap: 6px; margin-top: 9px; }
    .choice-row button { background: var(--surface-raised); border: 1px solid var(--line-strong); color: var(--text); border-radius: 6px; padding: 5px 9px; font-size: 11.5px; }
    .choice-row button[aria-pressed="true"] { background: var(--blue-faint); border-color: #7ca8ff70; color: var(--blue); }
    .capture-button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 47px; padding: 0 12px; border: 1px solid #ffffff20; border-radius: 10px; color: #fff; background: var(--blue-fill); font-size: 13px; font-weight: 660; text-align: left; box-shadow: 0 2px 8px #2f5fc332; }
    .capture-button:hover:not(:disabled) { background: var(--blue-fill-hover); }
    .capture-button:disabled { background: var(--surface-raised); color: var(--quiet); border-color: var(--line); box-shadow: none; }
    .capture-button svg { width: 17px; height: 17px; }
    .capture-button .hotkey { margin-left: auto; font-size: 11.5px; font-weight: 540; letter-spacing: .03em; color: #ffffffcf; white-space: nowrap; }
    .capture-button:disabled .hotkey { color: var(--quiet); }
    .capture-hint { height: 20px; padding: 5px 1px 0; color: var(--muted); font-size: 11.5px; }
    body[data-listening="true"] .capture-hint { color: var(--blue); }
    .capture-history { margin-top: 7px; }
    .footer-panel { margin: 0 18px 12px; padding: 12px; border: 1px solid var(--line-strong); background: var(--surface-raised); border-radius: 10px; color: var(--muted); font-size: 12px; line-height: 1.48; }
    .footer-panel[hidden] { display: none; }
    .footer-panel-head { display: flex; align-items: center; justify-content: space-between; color: var(--text); font-size: 12.5px; font-weight: 650; margin-bottom: 9px; }
    .footer-panel-head button { width: 23px; height: 23px; display: grid; place-items: center; border: 0; border-radius: 5px; color: var(--muted); background: transparent; }
    .footer-panel-head button:hover { background: var(--button-hover); }
    .footer-panel-head svg { width: 13px; height: 13px; }
    .footer-panel p { margin: 6px 0; }
    .footer-panel .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .footer-panel .setting-row + .setting-row { border-top: 1px solid var(--line); }
    .footer-panel .setting-row strong { font-weight: 590; color: var(--text); }
    .footer-panel .setting-row span { white-space: nowrap; }
    .footer-panel .small-action, .footer-panel .more-action { border: 1px solid var(--line-strong); background: var(--button); color: var(--text); border-radius: 7px; padding: 6px 9px; font-size: 11.5px; }
    .footer-panel .more-action { display: block; width: 100%; text-align: left; margin-top: 5px; }
    .footer-panel button:hover { background: var(--button-hover); }
    .menu-footer { min-height: 49px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 7px 13px; border-top: 1px solid var(--line); background: var(--surface-top); }
    .menu-footer button { border: 0; border-radius: 7px; background: transparent; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 7px; font-size: 12px; }
    .menu-footer button svg { width: 14px; height: 14px; }
    .menu-footer button:hover, .menu-footer button[aria-expanded="true"] { color: var(--text); background: var(--button-hover); }
    .toast { margin: 12px auto 0; min-height: 34px; width: fit-content; max-width: 100%; display: flex; align-items: center; justify-content: center; padding: 6px 11px; color: var(--page-text); font-size: 11.5px; text-align: center; line-height: 1.35; opacity: 0; transition: opacity .18s ease; }
    .toast.shown { opacity: 1; }
    @media (max-width: 410px) { body { padding: 20px 14px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
    body[data-reduce-motion="true"] *, body[data-reduce-motion="true"] *::before, body[data-reduce-motion="true"] *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  </style>
</head>
<body data-variant="a" data-theme="dark" data-listening="false">
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 5v14M23 10v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-capture" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v4m12-6h4a2 2 0 0 1 2 2v4M3 15v4a2 2 0 0 0 2 2h4m12-6v4a2 2 0 0 1-2 2h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="M3 5h13M9.5 3v2m4 0c-.6 5.1-3.7 8.8-8.6 11M5 9c1.8 3.2 4.6 5.5 8.6 7M14 20l4-10 4 10m-6.8-3h5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 7V3m0 4h4M4.8 15A8.5 8.5 0 1 0 5 8m7-1v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9a2.5 2.5 0 1 1 4.4 1.6C13 11.7 12 12 12 13.5M12 17.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div class="stage">
    <p class="demo-label"><strong>方向 A · 双区同屏</strong>　交互原型</p>
    <div class="demo-controls" aria-label="原型演示控制">
      <div class="segmented" aria-label="模拟语音状态">
        <button type="button" data-action="set-idle" aria-pressed="true">待机</button>
        <button type="button" data-action="set-listening" aria-pressed="false">聆听中</button>
      </div>
      <div class="segmented" aria-label="主题">
        <button type="button" data-action="set-dark" aria-pressed="true">深色</button>
        <button type="button" data-action="set-light" aria-pressed="false">浅色</button>
      </div>
    </div>

    <main id="menu" aria-label="Prosio 菜单设计原型">
      <header class="menu-header">
        <div class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#i-wave"/></svg><span>Prosio</span></div>
      </header>

      <div class="content">
        <section class="section" aria-labelledby="voice-title">
          <div class="section-head">
            <div class="section-name" id="voice-title"><svg aria-hidden="true"><use href="#i-wave"/></svg><span>语音输入</span></div>
            <span class="state voice-state"><span class="state-dot"></span><span id="voice-status">待机</span></span>
          </div>
          <div class="voice-idle">
            <span class="keycap">Fn</span>
            <span class="instruction">按 Fn 开始，再按一次结束<small>结束后，文字输入到当前光标位置</small></span>
          </div>
          <div class="voice-live" aria-label="模拟聆听中">
            <div class="live-left"><span class="live-waves" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span>正在聆听</span></div>
            <div class="live-actions"><button type="button" data-action="end-voice">结束</button><button type="button" data-action="cancel-voice">取消</button></div>
          </div>
          <div class="subrows">
            <button type="button" class="subrow" data-action="toggle-translate" aria-controls="translate-panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-translate"/></svg><span>翻译</span><span class="row-secondary">语音输入时</span><svg class="chevron" aria-hidden="true"><use href="#i-right"/></svg></button>
            <div class="inline-panel" id="translate-panel" hidden>
              <p class="panel-note">翻译是语音输入的一部分。以下语言仅供菜单交互演示。</p>
              <div class="choice-row" aria-label="模拟翻译语言"><button type="button" data-action="language" data-language="英语" aria-pressed="true">英语</button><button type="button" data-action="language" data-language="日语" aria-pressed="false">日语</button><button type="button" data-action="language" data-language="关闭" aria-pressed="false">关闭</button></div>
            </div>
            <button type="button" class="subrow" data-action="toggle-voice-history" aria-controls="voice-history-panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-history"/></svg><span>语音记录</span><span class="row-secondary">最近</span><svg class="chevron" aria-hidden="true"><use href="#i-right"/></svg></button>
            <div class="inline-panel" id="voice-history-panel" hidden><strong>示例记录 · 今天 09:41</strong><br>这是一条语音记录示例，不是你的实际内容。</div>
          </div>
        </section>

        <section class="section" aria-labelledby="capture-title">
          <div class="section-head"><div class="section-name" id="capture-title"><svg aria-hidden="true"><use href="#i-capture"/></svg><span>屏幕截图</span></div></div>
          <button type="button" class="capture-button" data-action="capture"><svg aria-hidden="true"><use href="#i-capture"/></svg><span>截取屏幕</span><span class="hotkey">⌃⇧2</span></button>
          <div class="capture-hint" id="capture-hint">框选后，可就地标注、复制或保存</div>
          <button type="button" class="subrow capture-history" data-action="toggle-capture-history" aria-controls="capture-history-panel" aria-expanded="false"><svg aria-hidden="true"><use href="#i-history"/></svg><span>截图记录</span><span class="row-secondary">最近</span><svg class="chevron" aria-hidden="true"><use href="#i-right"/></svg></button>
          <div class="inline-panel" id="capture-history-panel" hidden><strong>示例截图 · 今天 09:42</strong><br>这是一条截图记录示例，不会读取你的屏幕。</div>
        </section>
      </div>

      <div class="footer-panel" id="footer-panel" hidden aria-live="polite"></div>
      <footer class="menu-footer">
        <button type="button" data-action="footer-settings" aria-expanded="false"><svg aria-hidden="true"><use href="#i-settings"/></svg>设置</button>
        <button type="button" data-action="footer-help" aria-expanded="false"><svg aria-hidden="true"><use href="#i-help"/></svg>帮助</button>
        <button type="button" data-action="footer-more" aria-expanded="false"><svg aria-hidden="true"><use href="#i-more"/></svg>更多</button>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="demo-foot">仅演示菜单排版与反馈 · 不会录音、截图或修改设置</p>
  </div>

  <script>
    (() => {
      const body = document.body;
      const toast = document.getElementById('toast');
      const footerPanel = document.getElementById('footer-panel');
      const captureButton = document.querySelector('.capture-button');
      const captureHint = document.getElementById('capture-hint');
      let toastTimer;
      let openFooter = '';

      function notify(message) {
        toast.textContent = message;
        toast.classList.add('shown');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('shown'), 4400);
      }
      function setPressed(action, value) {
        const button = document.querySelector(`[data-action="${action}"]`);
        if (button) button.setAttribute('aria-pressed', String(value));
      }
      function setListening(listening, feedback = true) {
        body.dataset.listening = String(listening);
        document.getElementById('voice-status').textContent = listening ? '聆听中' : '待机';
        captureButton.disabled = listening;
        captureHint.textContent = listening ? '结束语音后可截图' : '框选后，可就地标注、复制或保存';
        setPressed('set-idle', !listening);
        setPressed('set-listening', listening);
        if (feedback) notify(listening ? '模拟状态：正在聆听；截图暂不可用。' : '模拟状态：语音已结束，可使用截图。');
      }
      function setTheme(theme) {
        body.dataset.theme = theme;
        setPressed('set-dark', theme === 'dark');
        setPressed('set-light', theme === 'light');
        notify(theme === 'dark' ? '已切换深色外观。' : '已切换浅色外观。');
      }
      function toggleInline(button, panelId) {
        const panel = document.getElementById(panelId);
        const opening = panel.hidden;
        panel.hidden = !opening;
        button.setAttribute('aria-expanded', String(opening));
      }
      const footerMarkup = {
        settings: `<div class="footer-panel-head"><span>设置</span><button type="button" data-action="close-footer" aria-label="关闭设置"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="setting-row"><strong>语音输入快捷键</strong><span>Fn</span></div><div class="setting-row"><strong>截图快捷键</strong><span>⌃⇧2</span></div><button type="button" class="small-action" data-action="change-hotkey">修改快捷键…</button>`,
        help: `<div class="footer-panel-head"><span>帮助</span><button type="button" data-action="close-footer" aria-label="关闭帮助"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><p>语音：按 Fn 开始，再按一次结束；录制中可取消。</p><p>截图：点击“截取屏幕”或按 ⌃⇧2，在屏幕上框选并标注。</p>`,
        more: `<div class="footer-panel-head"><span>更多</span><button type="button" data-action="close-footer" aria-label="关闭更多"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><button type="button" class="more-action" data-action="developer">开发设置…</button><button type="button" class="more-action" data-action="quit">退出 Prosio…</button>`
      };
      function showFooter(which) {
        const same = openFooter === which;
        openFooter = same ? '' : which;
        footerPanel.hidden = !openFooter;
        footerPanel.innerHTML = openFooter ? footerMarkup[openFooter] : '';
        ['settings', 'help', 'more'].forEach(name => {
          document.querySelector(`[data-action="footer-${name}"]`).setAttribute('aria-expanded', String(openFooter === name));
        });
      }
      document.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button || button.disabled) return;
        switch (button.dataset.action) {
          case 'set-idle': setListening(false); break;
          case 'set-listening': setListening(true); break;
          case 'set-dark': setTheme('dark'); break;
          case 'set-light': setTheme('light'); break;
          case 'end-voice': setListening(false); notify('模拟：已结束本次语音，未访问麦克风。'); break;
          case 'cancel-voice': setListening(false); notify('模拟：已取消本次语音，未保存内容。'); break;
          case 'capture': notify('模拟：已打开截图框选；不会截取真实屏幕。'); break;
          case 'toggle-translate': toggleInline(button, 'translate-panel'); break;
          case 'toggle-voice-history': toggleInline(button, 'voice-history-panel'); break;
          case 'toggle-capture-history': toggleInline(button, 'capture-history-panel'); break;
          case 'language':
            document.querySelectorAll('[data-action="language"]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
            notify(`模拟翻译偏好：${button.dataset.language}；不会修改真实设置。`);
            break;
          case 'footer-settings': showFooter('settings'); break;
          case 'footer-help': showFooter('help'); break;
          case 'footer-more': showFooter('more'); break;
          case 'close-footer': showFooter(openFooter); break;
          case 'change-hotkey': notify('快捷键修改属于正式设置；这里仅展示入口。'); break;
          case 'developer': notify('开发设置仅示意位置，不会改变应用。'); break;
          case 'quit': notify('仅演示退出入口；此页面不会关闭应用。'); break;
        }
      });
      setListening(false, false);
    })();
  </script>
</body>
</html>
