<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B · 工具便签</title>
<!-- 审核假设：一个活动便签；工具带贴近书写区，不承担文件管理。沿用既有菜单的系统字体、中性面板、柔和边界与蓝色动作。所有文件状态及系统行为均为演示，不写入真实文件。 -->
<style>
:root{color-scheme:light;--desk:#e8e9eb;--surface:#fff;--chrome:#f5f5f6;--rail:#f2f3f4;--ink:#26282c;--muted:#62666d;--line:#dedfe2;--blue:#1762ca;--active:#e1ebfa;--danger:#ad3b2e;--shadow:0 24px 70px #20263322,0 2px 8px #20263312}
*{box-sizing:border-box}body{margin:0;background:var(--desk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px}body[data-theme=dark]{color-scheme:dark;--desk:#23262b;--surface:#292c31;--chrome:#303339;--rail:#303339;--ink:#f0f1f3;--muted:#b6bac2;--line:#474b52;--blue:#8cbbff;--active:#394d68;--danger:#ffb3a7;--shadow:0 24px 70px #0005,0 2px 8px #0003}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent;border-radius:5px;min-height:30px}button:hover{background:var(--line)}button:focus-visible,input:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}button[aria-pressed=true]{background:var(--active);color:var(--blue)}[hidden]{display:none!important}.canvas{position:relative;width:1440px;height:900px;margin:0 auto;overflow:hidden}.review{position:absolute;left:126px;top:207px;width:420px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:600;color:var(--muted);margin:0 0 24px}.review h1{font-size:38px;line-height:1.25;letter-spacing:-1px;margin:0 0 20px;font-weight:650}.lead{font-size:18px;line-height:1.75;max-width:370px;margin:0 0 30px}.explanation{font-size:14px;line-height:1.8;color:var(--muted);max-width:350px;margin:0}.review hr{border:0;border-top:1px solid var(--line);margin:29px 0;width:350px}.demo{display:flex;gap:8px;flex-wrap:wrap;width:370px;margin-top:22px}.demo button{font-size:12px;background:var(--surface);padding:7px 12px;border:1px solid var(--line)}.disclaimer{font-size:12px;line-height:1.7;color:var(--muted);margin-top:14px;max-width:350px}.window-area{position:absolute;left:732px;top:196px}.window{width:490px;height:502px;min-width:360px;min-height:320px;display:flex;flex-direction:column;overflow:hidden;resize:both;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.titlebar{height:47px;flex-shrink:0;background:var(--chrome);display:flex;align-items:center;padding:0 12px;gap:9px;border-bottom:1px solid var(--line);user-select:none;cursor:move}.hide-button{width:30px;font-size:21px;line-height:1;color:var(--muted)}.title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pin{padding:0 10px;font-size:12px;display:flex;align-items:center;gap:6px}.pin svg{width:14px;height:14px}.work{display:flex;min-height:0;flex:1}.tools{width:54px;flex-shrink:0;border-right:1px solid var(--line);background:var(--rail);padding:14px 7px;display:flex;flex-direction:column;gap:5px}.tools button{width:38px;height:34px;font-size:17px}.tools button.small{font-size:14px}.tools hr{width:24px;border:0;border-top:1px solid var(--line);margin:8px auto}.tools .more{margin-top:auto}.paper{flex:1;min-width:0;overflow:auto;padding:21px 27px 18px;position:relative}.editor{outline:none;min-height:100%;font-size:16px;line-height:1.65;overflow-wrap:anywhere}.editor h1{font-size:24px;line-height:1.3;margin:0 0 13px;font-weight:650;letter-spacing:-.4px}.editor p{margin:0 0 17px}.editor h2{font-size:17px;margin:0 0 10px;font-weight:650}.editor .task{display:flex;align-items:flex-start;gap:9px;margin:4px 0}.editor input[type=checkbox]{width:15px;height:15px;margin:6px 0 0;accent-color:var(--blue);flex-shrink:0}.editor input:checked+span{text-decoration:line-through;color:var(--muted)}.editor blockquote{margin:19px 0 12px;padding-left:12px;border-left:2px solid var(--line);color:var(--muted);font-size:16px}.editor code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 7px;border-radius:4px;background:var(--rail)}.source{width:100%;height:100%;min-height:295px;resize:none;border:0;background:transparent;color:var(--ink);font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}.foot{background:var(--chrome);padding:11px 15px 12px;border-top:1px solid var(--line);font-size:12px;flex-shrink:0}.state-row{display:flex;align-items:center;gap:7px}.state{font-weight:550;flex:1}.state.error{color:var(--danger)}.foot button{color:var(--blue);font-size:12px;padding:0 7px;min-height:28px}.path{color:var(--muted);margin:3px 0 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.annotation{margin:20px 0 0 8px;color:var(--muted);font-size:12px;letter-spacing:.1px}.annotation strong{font-weight:550;color:var(--ink)}.hidden-note{width:490px;height:502px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--muted);font-size:14px;gap:16px}.hidden-note button{background:var(--surface);border:1px solid var(--line);padding:8px 16px;color:var(--blue);font-size:13px}.menu{position:absolute;left:45px;bottom:78px;width:168px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0002;z-index:3}.menu button{display:block;text-align:left;width:100%;font-size:13px;padding:7px 10px}.veil{position:fixed;inset:0;background:#0003;display:grid;place-items:center;z-index:10}.dialog{width:420px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:25px;box-shadow:var(--shadow)}.dialog h2{font-size:18px;margin:0 0 10px}.dialog p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 20px}.dialog label{display:block;font-size:12px;font-weight:550;margin-top:14px}.dialog input{width:100%;padding:9px 10px;background:var(--chrome);border:1px solid var(--line);border-radius:5px;font-size:14px;color:var(--ink);margin-top:6px}.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:26px}.dialog button{font-size:13px;padding:7px 15px;background:var(--chrome);border:1px solid var(--line)}.dialog .primary{background:var(--blue);color:var(--surface);border-color:var(--blue)}.feedback{height:32px;margin-top:13px;font-size:12px;line-height:1.6;color:var(--muted)}@media(max-width:1439px){.canvas{margin:0;width:1440px;transform-origin:top left;zoom:calc(100vw / 1440px)}}
</style>
</head>
<body data-direction="b" data-theme="light">
<main class="canvas">
<section class="review" aria-label="方向审核说明"><p class="eyebrow">方向 B / 交互初稿</p><h1>工具便签</h1><p class="lead">常用工具留在手边，<br>文字一直是主角。</p><p class="explanation">紧凑的竖直工具带，让标题、任务和代码随手可用。只有一张活动便签；底部始终交代内容保存到哪里。</p><hr><p class="explanation">适合一边记事，一边整理结构。<br>可直接编辑右侧正文，体验保存状态。</p><div class="demo" aria-label="原型演示控制"><button data-action="theme">切换深色</button><button data-action="fail">模拟保存失败</button><button data-action="restore">隐藏 / 恢复</button><button data-action="reset">重置演示</button></div><p class="disclaimer">以下内容均为假数据。置顶、隐藏和文件保存仅演示界面状态，不调用系统能力或写入真实文件。</p><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section>
<section class="window-area" aria-label="便签窗口演示">
<div class="window" id="note-window"><header class="titlebar"><button class="hide-button" data-action="hide" aria-label="隐藏便签" title="隐藏便签 · ⌘W">×</button><div class="title" id="title">未命名 · 草稿</div><button class="pin" data-action="pin" aria-pressed="true" title="切换置顶"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 3h6l-1 5 3 3H5l3-3-1-5ZM10 11v6"/></svg><span id="pin-label">已置顶</span></button></header>
<div class="work"><nav class="tools" aria-label="正文格式工具"><button data-action="heading" title="标题" aria-label="标题">H</button><button data-action="bold" title="加粗" aria-label="加粗"><b>B</b></button><button data-action="italic" title="斜体" aria-label="斜体"><i>I</i></button><hr><button class="small" data-action="task" title="任务项" aria-label="插入任务项">☑</button><button data-action="list" title="列表" aria-label="项目列表">≡</button><button data-action="quote" title="引用" aria-label="引用">“</button><button class="small" data-action="code" title="代码" aria-label="代码">&lt;/&gt;</button><button class="more" data-action="more" title="更多" aria-label="更多菜单" aria-expanded="false">···</button></nav><div class="paper"><div id="editor" class="editor" contenteditable="true" role="textbox" aria-label="便签正文" aria-multiline="true" spellcheck="false"></div><textarea id="source" class="source" aria-label="Markdown 源码" hidden spellcheck="false"></textarea></div></div>
<footer class="foot"><div class="state-row"><span class="state" id="state" role="status" aria-live="polite">未选择保存位置</span><button data-action="retry" hidden>重试</button><button data-action="save" id="save-action">选择位置…</button></div><p class="path" id="path">草稿恢复副本已保留 · 尚未写入文件</p></footer>
<div class="menu" id="menu" hidden><button data-action="source">源码模式</button><button data-action="save-as">另存为…</button><button data-action="info">便签说明</button></div>
</div><div class="hidden-note" id="hidden-note" hidden><span>便签已隐藏，正文仍保留</span><button data-action="restore">恢复便签</button></div><p class="annotation"><strong>单一活动便签</strong>　/　左侧工具带　/　可拖动与缩放</p>
</section></main>
<div class="veil" id="save-dialog" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">保存位置演示</h2><p>模拟选择 Markdown 文件名与文件夹。<br>本原型不会写入真实文件。</p><label>文件名<input id="filename" value="今天先记下.md"></label><label>保存到<input id="folder" value="文稿 / 便签"></label><div class="actions"><button data-action="cancel">取消</button><button class="primary" data-action="confirm-save">模拟保存</button></div></section></div>
<script>
const $=s=>document.querySelector(s);const initialHTML='<h1>今天先记下</h1><p>先把想法留下，再回到手头的事。</p><h2>接下来</h2><div class="task"><input type="checkbox" contenteditable="false" aria-label="整理会议中的三个要点"><span>整理会议中的三个要点</span></div><div class="task"><input type="checkbox" contenteditable="false" aria-label="把下一步发给同事"><span>把下一步发给同事</span></div><blockquote>重要的不是记得更多，而是少打断一次。</blockquote><p><code>⌃⌥N</code></p>';let selectedPath='',dirty=false,failed=false,sourceMode=false,composing=false,timer,saveTimer,version=0,range=null,lastFocus=null;
function feedback(t){$('#feedback').textContent=t}function status(t,error=false){$('#state').textContent=t;$('#state').classList.toggle('error',error);$('[data-action=retry]').hidden=!error;$('#save-action').textContent=error?'另存为…':selectedPath?'保存':'选择位置…';$('#path').textContent=selectedPath?'演示位置：'+selectedPath:'草稿恢复副本已保留 · 尚未写入文件'}
function edited(){dirty=true;version++;clearTimeout(timer);clearTimeout(saveTimer);if(failed){status('未能保存 · 内容已保留',true);return}status(selectedPath?'等待保存…':'未选择保存位置');if(selectedPath&&!composing)timer=setTimeout(save,1000)}
function save(){if(composing){clearTimeout(timer);return}if(!selectedPath){openSave();return}clearTimeout(timer);clearTimeout(saveTimer);const v=version;failed=false;status('保存中…');saveTimer=setTimeout(()=>{if(v!==version||composing)return;dirty=false;status('已保存（演示）')},450)}
function openSave(){lastFocus=document.activeElement;$('#menu').hidden=true;$('[data-action=more]').setAttribute('aria-expanded','false');$('#save-dialog').hidden=false;$('#filename').focus();$('#filename').select()}
function closeSave(){ $('#save-dialog').hidden=true;lastFocus?.focus() }
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(n){if(n.nodeType===3)return n.textContent;if(n.nodeType!==1)return '';let text=[...n.childNodes].map(inline).join('');if(n.tagName==='B'||n.tagName==='STRONG')return '**'+text+'**';if(n.tagName==='I'||n.tagName==='EM')return '*'+text+'*';if(n.tagName==='CODE')return '`'+text+'`';if(n.tagName==='BR')return '\n';return text}
function markdown(){return [...$('#editor').children].map(n=>{const t=inline(n);if(n.classList.contains('task'))return '- ['+(n.querySelector('input')?.checked?'x':' ')+'] '+t;if(n.tagName==='H1')return '# '+t;if(n.tagName==='H2')return '## '+t;if(n.tagName==='BLOCKQUOTE')return '> '+t;if(n.tagName==='UL')return [...n.children].map(li=>'- '+inline(li)).join('\n');return t}).join('\n\n')}
function fromMarkdown(s){const fm=t=>escapeHTML(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');return s.split('\n').map(line=>{if(!line.trim())return '';let m;if((m=line.match(/^- \[([ xX])\] (.*)$/)))return '<div class="task"><input type="checkbox" contenteditable="false" aria-label="'+escapeHTML(m[2])+'" '+(m[1]!==' '?'checked':'')+'><span>'+fm(m[2])+'</span></div>';if(line.startsWith('## '))return '<h2>'+fm(line.slice(3))+'</h2>';if(line.startsWith('# '))return '<h1>'+fm(line.slice(2))+'</h1>';if(line.startsWith('> '))return '<blockquote>'+fm(line.slice(2))+'</blockquote>';if(line.startsWith('- '))return '<ul><li>'+fm(line.slice(2))+'</li></ul>';return '<p>'+fm(line)+'</p>'}).join('')}
function toggleSource(){if(!sourceMode){$('#source').value=markdown()}else{$('#editor').innerHTML=fromMarkdown($('#source').value)}sourceMode=!sourceMode;$('#source').hidden=!sourceMode;$('#editor').hidden=sourceMode;$('[data-action=source]').textContent=sourceMode?'返回排版模式':'源码模式';$('#menu').hidden=true;$('#title').textContent=(selectedPath?selectedPath.split(' / ').pop():'未命名 · 草稿')+(sourceMode?' · 源码':'');(sourceMode?$('#source'):$('#editor')).focus();feedback(sourceMode?'源码模式：直接查看和编辑 Markdown。':'已返回排版模式。')}
function format(action){if(sourceMode){const t=$('#source'),a=t.selectionStart,b=t.selectionEnd,s=t.value.slice(a,b);let v=({heading:'## ',bold:'**'+(s||'文字')+'**',italic:'*'+(s||'文字')+'*',task:'- [ ] ',list:'- ',quote:'> ',code:'`'+(s||'代码')+'`'})[action];t.setRangeText(v,a,b,'end');t.focus();edited();return}$('#editor').focus();if(range){const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}if(action==='bold'||action==='italic')document.execCommand(action);if(action==='heading')document.execCommand('formatBlock',false,'h2');if(action==='quote')document.execCommand('formatBlock',false,'blockquote');if(action==='list')document.execCommand('insertUnorderedList');if(action==='task')document.execCommand('insertHTML',false,'<div class="task"><input type="checkbox" contenteditable="false" aria-label="新任务"><span>新任务</span></div>');if(action==='code'){const s=window.getSelection().toString();document.execCommand('insertHTML',false,'<code>'+escapeHTML(s||'代码')+'</code>')}edited()}
function hide(){if(selectedPath&&dirty&&!failed)save();$('#note-window').hidden=true;$('#hidden-note').hidden=false;$('#menu').hidden=true;feedback('便签已隐藏；正文与保存状态保留。')}
function restore(){if(!$('#note-window').hidden){hide();return}$('#note-window').hidden=false;$('#hidden-note').hidden=true;(sourceMode?$('#source'):$('#editor')).focus();feedback('已恢复上次的便签。')}
function reset(){clearTimeout(timer);clearTimeout(saveTimer);selectedPath='';dirty=false;failed=false;sourceMode=false;composing=false;version++;range=null;$('#editor').innerHTML=initialHTML;$('#editor').hidden=false;$('#source').hidden=true;$('#title').textContent='未命名 · 草稿';$('#note-window').hidden=false;$('#hidden-note').hidden=true;$('#menu').hidden=true;$('#save-dialog').hidden=true;$('[data-action=source]').textContent='源码模式';status('未选择保存位置');feedback('演示已重置。')}
for(const editor of [$('#editor'),$('#source')]){editor.addEventListener('compositionstart',()=>{composing=true;version++;clearTimeout(timer);clearTimeout(saveTimer)});editor.addEventListener('compositionend',()=>{composing=false;edited()})}$('#editor').addEventListener('input',edited);$('#editor').addEventListener('change',edited);$('#source').addEventListener('input',edited);document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(s.rangeCount&&$('#editor').contains(s.anchorNode))range=s.getRangeAt(0).cloneRange()});$('.tools').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(['heading','bold','italic','task','list','quote','code'].includes(a)){format(a);return}if(a==='pin'){let on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);$('#pin-label').textContent=on?'已置顶':'未置顶';feedback(on?'置顶已开启（原型状态）。':'置顶已关闭（原型状态）。')}if(a==='hide')hide();if(a==='restore')restore();if(a==='save')failed?openSave():save();if(a==='save-as')openSave();if(a==='cancel'){closeSave();feedback('已取消选择，便签内容仍保留。')}if(a==='confirm-save'){const name=$('#filename').value.trim(),folder=$('#folder').value.trim();if(!name||!folder){feedback('请填写文件名和演示位置。');return}selectedPath=folder+' / '+(name.endsWith('.md')?name:name+'.md');$('#title').textContent=(name.endsWith('.md')?name:name+'.md')+(sourceMode?' · 源码':'');closeSave();save();feedback('模拟保存：没有写入真实文件。')}if(a==='retry'){if(!selectedPath){openSave()}else{save();feedback('正在重试模拟保存。')}}if(a==='fail'){clearTimeout(timer);clearTimeout(saveTimer);failed=true;dirty=true;version++;status('未能保存 · 内容已保留',true);feedback('已模拟文件写入失败，正文仍可继续编辑。')}if(a==='theme'){const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';b.textContent=dark?'切换浅色':'切换深色'}if(a==='more'){$('#menu').hidden=!$('#menu').hidden;b.setAttribute('aria-expanded',!$('#menu').hidden)}if(a==='source')toggleSource();if(a==='info'){$('#menu').hidden=true;feedback('本原型只显示一个活动便签；格式编辑为界面演示。')}if(a==='reset')reset()});
document.addEventListener('keydown',e=>{if(composing||e.isComposing||e.keyCode===229)return;if(!$('#save-dialog').hidden){if(e.key==='Escape'){e.preventDefault();closeSave();feedback('已取消选择，便签内容仍保留。')}if(e.key==='Tab'){const f=[...$('#save-dialog').querySelectorAll('input,button')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='w'){e.preventDefault();hide()}if(e.key==='Escape'&&!e.isComposing){if(!$('#menu').hidden){$('#menu').hidden=true;$('[data-action=more]').setAttribute('aria-expanded','false')}else hide()}});
let drag=null;$('.titlebar').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const area=$('.window-area');drag={x:e.clientX,y:e.clientY,left:area.offsetLeft,top:area.offsetTop};$('.titlebar').setPointerCapture(e.pointerId)});$('.titlebar').addEventListener('pointermove',e=>{if(!drag)return;const zoom=parseFloat(getComputedStyle($('.canvas')).zoom)||1;$('.window-area').style.left=Math.max(0,Math.min(1440-$('#note-window').offsetWidth,drag.left+(e.clientX-drag.x)/zoom))+'px';$('.window-area').style.top=Math.max(0,Math.min(900-$('#note-window').offsetHeight,drag.top+(e.clientY-drag.y)/zoom))+'px'});$('.titlebar').addEventListener('pointerup',()=>drag=null);
reset();feedback('可编辑正文。工具带用于当前便签，不是笔记列表。');
</script>
</body></html>
