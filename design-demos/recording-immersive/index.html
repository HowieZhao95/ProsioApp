<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prosio · 沉浸录屏三种布局</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#2e3540;font-family:-apple-system,"PingFang SC",sans-serif;padding:35px 4vw}header{display:flex;align-items:baseline;gap:20px;margin-bottom:28px}h1{font-size:25px;letter-spacing:-.5px;font-weight:600;margin:0}header p{color:#7c8792;font-size:13px;margin:0}.grid{display:grid;gap:28px}.card{display:grid;grid-template-columns:190px 1fr;gap:25px;align-items:center}.card h2{font-size:18px;font-weight:500;margin:0 0 9px}.card p{color:#7d8791;font-size:13px;line-height:1.8}.card a{font-size:13px;color:#3478bb;text-decoration:none}.preview{position:relative;aspect-ratio:1440/900;overflow:hidden;border-radius:10px;box-shadow:0 6px 30px #1d293c13;border:1px solid #c7d0d966}.preview img{width:100%;display:block}.preview a{position:absolute;inset:0}@media(min-width:1600px){.grid{grid-template-columns:repeat(3,1fr)}.card{display:block}.card .preview{margin-top:18px}}@media(max-width:700px){.card{display:block}.preview{margin-top:16px}}</style><header><h1>让录制，回到桌面上。</h1><p>三种控件布局 · 同一套直接操作</p></header><div class="grid"><article class="card"><div><h2>A　底部悬浮</h2><p>最接近系统录制工具。工具栏固定在下方，两路机位独立浮动。</p><a href="a.html">进入交互原型 →</a></div><div class="preview"><img src="a.png" alt="A　底部悬浮"><a href="a.html" aria-label="打开A　底部悬浮"></a></div></article><article class="card"><div><h2>B　贴近窗口</h2><p>操作跟在录制目标旁边。适合围绕一个窗口进行讲解。</p><a href="b.html">进入交互原型 →</a></div><div class="preview"><img src="b.png" alt="B　贴近窗口"><a href="b.html" aria-label="打开B　贴近窗口"></a></div></article><article class="card"><div><h2>C　一体预览坞</h2><p>两个机位与工具栏集中在同一处。少分散，方便开拍前确认。</p><a href="c.html">进入交互原型 →</a></div><div class="preview"><img src="c.png" alt="C　一体预览坞"><a href="c.html" aria-label="打开C　一体预览坞"></a></div></article></div><p style="color:#9098a2;font-size:12px;margin-top:26px">设计原型，不调用真实设备。预览采用示意照片；移动预览不改
