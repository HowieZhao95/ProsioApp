<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prosio · 原生导引</title><style>*{box-sizing:border-box}body{margin:0;background:#eaebef;color:#25272e;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:28px 24px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;font-weight:600;margin:0}p{color:#686c76;margin:8px 0 20px;font-size:13px}select,button{font:inherit;color:inherit;padding:10px 16px;border:1px solid #d6d9e2;border-radius:8px;background:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #829acb;outline-offset:3px}figure{margin:20px 0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 14px 48px #27304616;border:1px solid #d9dce3}img{display:block;width:100%;height:auto}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button{border-color:transparent;background:transparent;font-size:13px}nav button[aria-current=true]{background:#dde2ed;color:#465b80}footer button:last-child{background:#4a5e85;color:#fff;border-color:#4a5e85}@media(max-width:600px){main{padding:20px 12px}nav{gap:0}nav button{padding:8px}header{align-items:flex-start}}@media(prefers-color-scheme:dark){body{background:#28292c;color:#ddd}figure{border-color:#4e5158}select,button{background:#34363b;color:#ddd;border-color:#51545c}nav button[aria-current=true]{background:#3d4657;color:#c3d0e9}p{color:#a9acb4}}</style><main><header><h1>Prosio · 启动导引</h1><select aria-label="预览外观" id="mode"><option value="light">浅色</option><option value="dark">深色</option><option value="compact">紧凑窗口</option></select></header><p>原生界面实拍 · B 精简版</p><nav aria-label="导引页面" id="nav"></nav><figure><img id="view" alt=""></figure><footer><button id="prev">← 上一步</button><span id="count"></span><button id="next">下一步 →</button></footer></main><script>const names=["语音输入", "屏幕截图", "桌面便签", "更多工具", "开始使用"];let page=0;const mode=document.getElementById('mode'),view=document.getElementById('view'),nav=document.getElementById('nav');names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+name;b.onclick=()=>{page=i;render()};nav.append(b)});function render(){view.src='screenshots/native-'+mode.value+'/'+(page+1)+'-'+names[page]+(mode.value==='dark'?'-dark':'')+'.png';view.alt='Prosio 原生导引：'+names[page];document.getElementById('count').textContent=(page+1)+' / 5';document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===4;[...nav.children].forEach((b,i)=>b.setAttribute('aria-current',String(page===i)))}document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};mode.onchange=render;render();</script></html>
