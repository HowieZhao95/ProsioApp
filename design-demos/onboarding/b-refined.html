const features={tools:{title:'还有这些顺手的事。',detail:'录下来、讲清楚、看看任务进展。',caption:'更多工具',needs:[]},ready:{title:'用得上时，就在这里。',detail:'点击菜单栏的 Prosio，继续你的工作。',caption:'开始使用',needs:[]},voice:{title:'说出来，写下来。',detail:'输入、翻译、改写，开口即可。',caption:'语音输入',needs:['microphone','accessibility']},capture:{title:'截下来，说明白。',detail:'框选、标注、复制，一气呵成。',caption:'屏幕截图',needs:['screen']},notes:{title:'想到了，就记下。',detail:'灵感与待办，随手留在桌面。',caption:'桌面便签',needs:[]},recording:{title:'把操作录下来。',detail:'选择一块屏幕，录下演示过程。',caption:'屏幕录制',needs:['screen']},meeting:{title:'专心聊，之后再回看。',detail:'录下会议，在记录中查看转写与重点。',caption:'录音转写',needs:['microphone']},presentation:{title:'让大家看见你的重点。',detail:'用聚光与倒计时，让演示更清楚。',caption:'演示辅助',needs:[]},agents:{title:'任务进展，一眼知道。',detail:'查看 Codex 任务，及时发现需要处理的事情。',caption:'Agent 任务',needs:[]}};
const perms={microphone:['麦克风','用来听见你说的话','隐私与安全性 → 麦克风'],accessibility:['辅助功能','把文字写入当前应用','隐私与安全性 → 辅助功能'],screen:['屏幕录制','获取你选中的屏幕内容','隐私与安全性 → 屏幕录制']};
const names={dictate:'直接输入',polish:'整理表达',translate:'翻译',rewrite:'选文改写'};
const examples={dictate:['明天下午三点，我们一起讨论新方案。','明天下午三点，我们一起讨论新方案。'],polish:['嗯，明天那个，三点开会吧，哦不，改成四点。','明天下午四点开会。'],translate:['我们明天下午三点见。','Let’s meet tomorrow at 3 p.m.'],rewrite:['明天下午三点我们将召开会议，届时会一起讨论新的方案，请大家记得参加。','明天下午三点开会，讨论新方案。']};
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function logo(){return '<div class="brand"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Prosio</div>';}
function button(label,action,style='primary',extra=''){return `<button class="${style}" data-action="${action}" ${extra}>${label}</button>`;}
function ready(){return features[model.feature].needs.every(p=>model.granted[p])&&(model.feature!=='voice'||model.key!=='Fn'||model.fnDone);}
function featureTabs(ids,cls='feature-tabs'){return `<nav class="${cls}" aria-label="功能体验">${ids.map(id=>button(features[id].caption,'feature',id===model.feature?'active':'',`data-value="${id}" aria-current="${id===model.feature?'page':'false'}"`)).join('')}</nav>`;}
function modeTabs(){return `<nav class="feature-tabs" aria-label="语音体验方式">${Object.entries(names).map(([id,title])=>button(title,'mode',id===model.mode?'active':'',`data-value="${id}" aria-pressed="${id===model.mode}"`)).join('')}</nav>`;}
function grantList(){return `<div class="permission-group">${features[model.feature].needs.map((kind,i)=>`<div class="permission-line"><span class="perm-number">0${i+1}</span><div class="grow"><h3>${perms[kind][0]}</h3><p>${perms[kind][1]}</p></div>${model.granted[kind]?'<span class="granted">✓ 已开启</span>':button('开启','permission','grant',`data-value="${kind}"`)}</div>`).join('')}</div>`;}
function shortcut(){return model.feature==='voice'?`<div class="shortcut"><span class="hint"><strong>语音快捷键</strong></span><select aria-label="语音快捷键"><option ${model.key==='Fn'?'selected':''}>Fn</option><option ${model.key==='右 ⌘'?'selected':''}>右 ⌘</option><option ${model.key==='右 ⌥'?'selected':''}>右 ⌥</option><option ${model.key==='右 ⌃'?'selected':''}>右 ⌃</option></select></div>${model.key==='Fn'?`<div class="fn-tip"><p>在键盘设置里，将 Fn 键设为「不执行任何操作」。</p><label><input type="checkbox" id="fn-done" ${model.fnDone?'checked':''}>我已设置好</label></div>`:model.key==='右 ⌥'?'<p class="hint section-gap">右 Option 已用于语音。截图请使用其他组合键，避免冲突。</p>':'<p class="hint" style="margin-top:8px">使用右侧按键，不影响左侧组合键。</p>'}`:'';}
function cloudHint(){return ['voice','meeting','agents'].includes(model.feature)?button(model.feature==='agents'?'连接与隐私说明':'智能功能的账号与服务设置','account','link'):'';}
function demo(){const f=model.feature;let body='',foot='';if(f==='voice'){body=`<div class="demo-label">${model.result?'示例结果':model.mode==='rewrite'?'先选中，再说「简短一点」':'试着说这一句'}</div>${model.result?`<div class="result" aria-live="polite">${examples[model.mode][1]}</div>`:`<div class="sample">${model.mode==='rewrite'?'<mark>':''}${examples[model.mode][0]}${model.mode==='rewrite'?'</mark>':''}</div>`}`;foot=`<kbd class="key">${esc(model.key)}</kbd><span>${model.result?'文字已写入练习区':'按一次开始，再按一次结束 · Esc 取消'}</span>`;}else if(f==='capture'){body=`<div class="capture-scene"><div class="capture-sheet"><div class="demo-label">框选区域 · 示例</div>${model.translated?'Tomorrow at 3 p.m. — proposal review':'明天下午三点 · 新方案讨论'}${model.annotated?'<span class="annotation">重点</span>':''}</div></div><div class="capture-tools">${button(model.annotated?'移除标注':'加个标注','annotate','')}${button(model.translated?'查看原文':'翻译选区','translate-capture','')}</div>`;foot='框选 → 标注 → 复制到需要的地方';}else if(f==='notes'){body=`<label class="sr-only" for="note-text">便签内容</label><div class="note-demo"><textarea id="note-text">${esc(model.note)}</textarea></div>`;foot='可直接输入 · 此处是临时练习区';}else if(f==='recording'){body=`<div class="demo-label">已选择：这块练习区</div><div class="time-display">${clockText()}</div><div class="hint">${model.playing?'示例录制进行中，结束后预览。':model.result?'录制示例已结束，可再试一次。':'先选择范围，再开始录制。'}</div>`;foot='屏幕声音、摄像头可按需开启';}else if(f==='meeting'){body=`<div class="demo-label">会议记录 · 示例</div><div class="time-display">${model.result?'会议重点':model.playing?'正在录音…':'准备就绪'}</div><div class="meeting-line">${model.result?'明天下午三点讨论新方案。会前整理需求清单。':'“我们明天下午三点讨论新方案，会前先整理需求清单。”'}</div>`;foot='录音 → 转写 → 回看重点';}else if(f==='presentation'){body=`<div class="spot-scene ${model.focused?'focused':''}"><div class="demo-label">演示练习区</div><div class="spot-target">让大家注意到这句话。</div></div>`;foot='试一次聚光效果，关注你的讲解';}else{body=`<div class="demo-label">示例任务 · 非实时数据</div><div class="agent-line"><span>整理页面文案</span><span class="muted">进行中</span></div><div class="agent-line"><span>检查交互细节</span><span style="color:#4662ad">${model.result?'已查看':'需要你确认'}</span></div>`;foot='选择本机 Codex 数据来源后，才能查看真实任务';}return `<div class="demo"><div class="demo-head"><span>${features[f].caption} · 练习区</span><span>${f==='voice'&&model.result?'✓ 已完成示例':'可以放心试'}</span></div><div class="demo-body">${body}</div><div class="demo-foot">${foot}</div></div>`;}
function clockText(){return '00:'+String(model.seconds).padStart(2,'0');}
function tryLabel(){return {voice:model.result?'再试一次':'开始体验',capture:'试试标注',notes:'写下一个想法',recording:model.playing?'结束示例录制':'开始示例录制',meeting:model.playing?'结束并查看重点':'开始会议示例',presentation:model.focused?'关闭聚光':'试试聚光',agents:'查看示例任务'}[model.feature];}
function tryButton(){return button(tryLabel(),'try');}
function more(){return `<div class="more-actions">${['recording','meeting','presentation','agents'].map(id=>button(features[id].caption,'feature','',`data-value="${id}"`)).join('')}</div>`;}
function done(){return `<section class="done"><div class="completion">✓</div><h1>用得上时，Prosio 就在这里。</h1><p class="lead">点菜单栏的波形图标，随时输入、截图或打开便签。</p><div class="menu-example"><span>⌁</span><span>Wi-Fi</span><span>100%</span>${logo().replace('Prosio','')}<span>周日 10:04</span></div><p class="hint">暂时没开启的功能，第一次使用时再设置就好。</p><div class="button-row" style="justify-content:center;margin-top:28px">${button('继续探索','explore')}${button('重新看导引','reset','secondary')}</div><div class="toast" aria-live="polite">${esc(model.notice)}</div></section>`;}
function renderA(){const step=model.page==='welcome'?0:model.page==='prepare'?1:2;return `<header class="a-header">${logo()}<div class="steps" aria-label="导引步骤">${['认识','准备','试一次'].map((s,i)=>`<span class="${i===step?'active':''}">${i+1} ${s}</span>`).join('')}</div></header>${model.page==='welcome'?`<main class="a-main a-welcome"><p class="eyebrow">欢迎使用 Prosio</p><h1>想说的，变成写好的。</h1><p class="lead">从说出第一句话开始，认识你的 Mac 小助手。</p><div class="demo"><div class="demo-head"><span>先看看，语音能做什么</span><span>示例</span></div><div class="demo-body"><div class="demo-label">你说</div><div class="sample">“嗯，明天那个，三点开会吧，哦不，改成四点。”</div><div class="demo-label" style="margin-top:18px">写下来就是</div><div class="result">明天下午四点开会。</div></div></div><div class="button-row">${button('设置并试一句','begin')}${button('先试试便签','notes-first','secondary')}</div><p class="welcome-caption">不需要一次学会所有功能。</p></main>`:model.page==='prepare'?`<main class="a-main"><p class="eyebrow">只做这次体验需要的设置</p><h1>${features[model.feature].needs.length?'让 Prosio 帮你完成这一步。':'这个体验，可以直接开始。'}</h1><p class="lead">${features[model.feature].detail}</p>${grantList()}${shortcut()}<div class="footer-actions">${button('返回','back','quiet')}${button(ready()?'准备好了，试一次':'完成设置后体验','prepared')}</div><div class="toast" aria-live="polite">${esc(model.notice)}</div></main>`:`<main class="a-main"><p class="eyebrow">边做边认识 Prosio</p><h1>${features[model.feature].title}</h1><p class="lead">${features[model.feature].detail}</p>${featureTabs(['voice','capture','notes'])}${model.feature==='voice'?modeTabs():''}${demo()}<div class="below-demo">${ready()?tryButton():button('设置并体验','setup')}<span class="hint">${model.feature==='voice'?'这里先播放示例，正式应用可直接开口。':'所有内容都留在这个练习区。'}</span></div><div class="toast" aria-live="polite">${esc(model.notice)}</div></main>`}<footer class="a-bottom"><span>语音与屏幕，随手可用</span><div class="button-row">${button('看看其他功能','more','quiet')}${button('稍后再探索','finish','link')}</div></footer>`;}
function renderB(){const ordered=['voice','capture','notes','tools','ready'];const i=ordered.indexOf(model.feature);const active=i<0?3:i;let content='';if(model.feature==='tools'){content=`<div class="tool-list">${[['recording','屏幕录制','记录操作，分享过程。'],['meeting','录音转写','留下声音，回看文字。'],['presentation','演示辅助','突出光标，讲清重点。'],['agents','Agent 任务','进展与待办，一眼知道。']].map(([id,title,detail])=>`<div class="tool-row"><div><h3>${title}</h3><p>${detail}</p></div>${button('试用','feature','secondary',`data-value="${id}"`)}</div>`).join('')}</div>`;}else if(model.feature==='ready'){content=`<div class="menu-bar-preview"><span>Wi-Fi</span><span>100%</span><span class="menu-wave">${logo()}</span></div><p class="ready-tagline">语音与屏幕，随手可用。</p><div class="ready-list">${['voice','capture','notes'].map(id=>`<div><span>${features[id].caption}</span><span class="muted">${features[id].needs.every(k=>model.granted[k])?'已就绪':'稍后设置'}</span></div>`).join('')}</div><p class="hint" style="margin-top:22px">没设置的，第一次使用时再开启。</p>`;}else{content=`${model.feature==='voice'?`<nav class="lean-modes">${[['dictate','输入'],['translate','翻译'],['rewrite','改写']].map(([id,label])=>button(label,'mode',model.mode===id?'active':'',`data-value="${id}"`)).join('')}</nav>`:''}${demo()}<div class="below-demo">${ready()?tryButton():button('设置并体验','setup')}${button('设置','setup','quiet')}<span class="hint">${model.feature==='voice'?esc(model.key)+' 开始 · 再按结束':model.feature==='notes'?'无需权限':''}</span></div>${!ready()?`<div class="lean-permission">${model.feature==='voice'?'先开启麦克风与辅助功能。':'首次使用时开启对应权限。'}</div>`:''}`;}
return `<div class="b-layout refined"><aside class="b-sidebar">${logo()}<p class="nav-caption">开始探索</p><nav class="b-nav">${ordered.map((id,index)=>`<button data-action="feature" data-value="${id}" class="${index===active?'active':''}"><span class="nav-number">0${index+1}</span>${features[id].caption}</button>`).join('')}</nav><div class="sidebar-footer">${button('稍后设置','finish','quiet')}</div></aside><div class="b-right"><main class="b-main"><h1>${features[model.feature].title}</h1><p class="lead">${features[model.feature].detail}</p>${content}<div class="toast" aria-live="polite">${esc(model.notice)}</div></main><footer class="lean-navigation">${active>0?button('‹　上一步','feature','quiet',`data-value="${ordered[active-1]}"`):'<span></span>'}<span class="page-count">${active+1} / 5</span>${active<4?button('下一步　›','feature','primary',`data-value="${ordered[active+1]}"`):button('开始使用','finish')}</footer></div></div>`;}
function renderC(){return `<header class="c-header">${logo()}${button('稍后再探索','finish','quiet')}</header><section class="c-title"><p class="eyebrow">从你现在想做的事开始</p><h1>少一点操作，多一点顺手。</h1><p class="lead">选一件小事试试，设置会跟着需要出现。</p></section><nav class="c-tabs" aria-label="选择任务">${[['voice','把话写下来'],['capture','截个图说明'],['notes','记住一个想法']].map(([id,title])=>button(title,'feature',id===model.feature?'active':'',`data-value="${id}"`)).join('')}${button('更多…','more',!['voice','capture','notes'].includes(model.feature)?'active':'')}</nav><div class="c-layout"><main><p class="screen-name">${features[model.feature].caption}</p><h2 style="margin-top:4px">${features[model.feature].title}</h2>${model.feature==='voice'?modeTabs():''}${demo()}<div class="below-demo">${ready()?tryButton():button('先看看示例','preview')}<span class="hint">${model.feature==='voice'?'说自然的话就好。':'在这个小空间里放心试。'}</span></div><div class="toast" aria-live="polite">${esc(model.notice)}</div></main><aside class="c-prep"><h3>${ready()?'已准备好，可以开始。':'开始前，准备一下。'}</h3><p class="hint" style="margin-top:6px">${features[model.feature].needs.length?'只开启当前功能需要的权限。':'这项体验无需系统权限。'}</p>${grantList()}${shortcut()}${cloudHint()}<div class="hint" style="margin-top:14px">${ready()?'✓ 每一步都可以按自己的节奏来。':'也可以先看示例，稍后再设置。'}</div></aside></div><footer class="c-bottom"><span>第一次不用全部学会。</span>${button('我知道怎么用了','finish','link')}</footer>`;}
function modal(){if(!model.modal)return '';let content='';if(model.modal==='permission'){const kind=model.permission;content=`<div class="modal-top"><h2>${model.denied?'没关系，稍后也能开启。':`允许${perms[kind][0]}访问`}</h2>${button('×','close','', 'aria-label="关闭"')}</div><p class="hint">${perms[kind][1]}。此处演示 macOS 授权反馈。</p>${model.denied?`<ol><li>打开系统设置 → ${perms[kind][2]}</li><li>开启 Prosio；系统提示时退出并重新打开。</li><li>返回导引，检查权限状态。</li></ol><div class="button-row">${button('模拟返回后已开启','grant')}${button('仍未开启','still-denied','secondary')}</div>`:`<div class="button-row">${button('模拟允许','grant')}${button('模拟拒绝','deny','secondary')}</div>`}`;}else if(model.modal==='setup'){content=`<div class="modal-top"><h2>准备好，再试一次。</h2>${button('×','close','', 'aria-label="关闭"')}</div><p class="hint">${features[model.feature].detail}</p>${grantList()}${shortcut()}<div class="footer-actions">${button('稍后设置','close','quiet')}${button('开始体验','prepared')}</div><div class="toast" aria-live="polite">${esc(model.notice)}</div>`;}else if(model.modal==='more'){content=`<div class="modal-top"><h2>还有这些顺手的事。</h2>${button('×','close','', 'aria-label="关闭"')}</div><p class="hint">选一个体验，不用一次学会。</p>${more()}<p class="hint">录屏与会议录音会在首次使用时请求对应权限。演示基础功能无需麦克风。</p>`;}else{content=`<div class="modal-top"><h2>${model.feature==='agents'?'连接你的 Codex':'账号与智能服务'}</h2>${button('×','close','', 'aria-label="关闭"')}</div><p class="hint">${model.feature==='agents'?'真实任务需要你选择本机 Codex 数据来源。访问范围与连接状态会在设置中说明。':'智能整理、翻译与会议转写使用云端服务。正式体验前会检查账号与服务是否可用；无需在认识产品前完成登录。'}</p><p class="hint">本原型只播放明确标注的示例。账号入口沿用现有应用设置，实际连接结果会分别显示。</p><div class="button-row">${button('知道了','close')}</div>`;}return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="设置与体验">${content}</section></div>`;}
function render(){const active=document.activeElement?.id;document.getElementById('workspace').innerHTML=(model.page==='done'?done():direction==='a'?renderA():direction==='b'?renderB():renderC())+modal();if(active==='fn-done')document.getElementById(active)?.focus();if(model.modal){const focus=document.querySelector('.modal button,.modal select');focus?.focus();}}
function feature(value){stopTimer();model.feature=value;model.result=false;model.playing=false;model.notice='';model.modal=null;if(direction==='a')model.page='experience';render();}
function stopTimer(){clearInterval(model.timer);model.timer=null;}
function perform(){if(!ready()){model.notice='先完成当前功能需要的设置，再体验。';if(direction==='a')model.page='prepare';else model.modal='setup';render();return;}if(model.feature==='voice'){model.result=!model.result;model.notice=model.result?'做到了。换个例子，再感受一下。':'';}else if(model.feature==='capture'){model.annotated=!model.annotated;}else if(model.feature==='notes'){model.notice='直接在便签里输入，试试记下一个想法。';render();document.getElementById('note-text')?.focus();return;}else if(['recording','meeting'].includes(model.feature)){model.playing=!model.playing;model.result=!model.playing;if(model.playing){model.seconds=0;model.timer=setInterval(()=>{model.seconds=Math.min(59,model.seconds+1);const time=document.querySelector('.time-display');if(time&&model.feature==='recording')time.textContent=clockText();},1000);}else stopTimer();}else if(model.feature==='presentation'){model.focused=!model.focused;}else{model.result=true;model.notice='真实任务中，可以打开来源并继续处理。';}render();}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,value=target.dataset.value;model.notice='';switch(action){case 'begin':model.page='prepare';break;case 'notes-first':feature('notes');return;case 'feature':feature(value);return;case 'mode':model.mode=value;model.result=false;break;case 'permission':model.modal='permission';model.permission=value;model.denied=false;break;case 'grant':model.granted[model.permission]=true;model.modal=direction==='b'?'setup':null;model.denied=false;break;case 'deny':model.denied=true;break;case 'still-denied':model.notice='权限仍未开启，先看看示例也可以。';model.modal=null;break;case 'setup':if(direction==='a')model.page='prepare';else model.modal='setup';break;case 'prepared':if(!ready()){model.notice=model.feature==='voice'&&model.key==='Fn'&&!model.fnDone?'请确认 Fn 的系统动作，或换用右侧按键。':'还差一个权限，可以开启后再试，也可以先看看示例。';break;}model.page='experience';model.modal=null;render();perform();return;case 'back':model.page='welcome';break;case 'close':model.modal=null;break;case 'more':model.modal='more';break;case 'account':model.modal='account';break;case 'preview':model.result=!model.result;model.notice='这是预置示例。设置完成后，正式应用可体验自己的内容。';break;case 'try':perform();return;case 'annotate':model.annotated=!model.annotated;break;case 'translate-capture':model.translated=!model.translated;break;case 'finish':stopTimer();model.modal=null;model.page='done';break;case 'explore':model.page='experience';break;case 'reset':model.page='welcome';model.feature='voice';model.result=false;break;}render();});
document.addEventListener('change',event=>{if(event.target.matches('select')){model.key=event.target.value;render();}if(event.target.id==='fn-done'){model.fnDone=event.target.checked;render();}});
document.addEventListener('input',event=>{if(event.target.id==='note-text')model.note=event.target.value;});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(model.modal){model.modal=null;render();}else if(model.playing){stopTimer();model.playing=false;model.notice='已取消本次示例。';render();}}if(event.key==='Tab'&&model.modal){const focusable=[...document.querySelectorAll('.modal button,.modal input,.modal select')];const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
render();
</script></body></html>
