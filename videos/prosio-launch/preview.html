<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Prosio 49秒品牌片本地审片播放器" />
    <title>Prosio · 49秒品牌片</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif; color: #232629; background: #fafafa; font-synthesis: none; -webkit-font-smoothing: antialiased; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 280px; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      a { color: inherit; }
      .preview-shell { width: min(1320px, 100%); margin: 0 auto; padding: 42px 40px 28px; }
      .preview-header { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 24px; }
      .eyebrow { margin: 0 0 9px; font-size: 10px; font-weight: 650; letter-spacing: .24em; color: #83878a; }
      h1 { margin: 0; font-size: clamp(20px, 2.2vw, 29px); line-height: 1.25; font-weight: 560; letter-spacing: -.045em; }
      h1 span { padding: 0 2px; color: #9a9da0; }
      .studio-link { flex-shrink: 0; font-size: 12px; text-decoration: none; color: #74797e; padding: 8px 0 8px 12px; }
      .studio-link:hover { color: #232629; }
      .studio-link span { margin-left: 5px; }
      .player-surface { background: #fff; border: 1px solid #e4e5e7; border-radius: 15px; overflow: hidden; box-shadow: 0 14px 42px rgba(22, 31, 39, .055), 0 2px 8px rgba(22, 31, 39, .018); }
      .player-surface > div { display: block !important; }
      .chapters { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 7px; margin: 18px 0 0; }
      .chapter { position: relative; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; text-align: left; background: transparent; color: #62696f; border: 1px solid transparent; border-radius: 8px; padding: 12px 11px; cursor: pointer; transition: background .15s, border-color .15s; }
      .chapter:hover { background: #f0f1f2; }
      .chapter.is-active { background: #fff; border-color: #dfe3e6; color: #252b30; }
      .chapter-time { font-size: 11px; font-variant-numeric: tabular-nums; color: #999fa4; }
      .chapter-title { font-size: 12px; line-height: 1.35; white-space: nowrap; }
      .chapter.is-active .chapter-time { color: #657f92; }
      button:focus-visible, a:focus-visible { outline: 2px solid #778f9f; outline-offset: 3px; }
      .preview-footer { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-top: 22px; padding-top: 19px; border-top: 1px solid #eaebed; color: #979da2; font-size: 11px; line-height: 1.7; }
      .preview-footer p { margin: 0; }
      .preview-footer p span { padding: 0 6px; }
      .format-note { flex-shrink: 0; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
      .player-error { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 10%; background: #fff; color: #42474b; }
      .player-error strong { font-size: 20px; }
      .player-error p { font-size: 14px; }
      .player-error small { max-width: 600px; overflow-wrap: anywhere; color: #8b9196; }
      @media (max-width: 900px) {
        .preview-shell { padding: 28px 24px 22px; }
        .chapters { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      }
      @media (max-width: 560px) {
        .preview-shell { padding: 23px 14px 18px; }
        .preview-header { gap: 12px; margin-bottom: 19px; align-items: flex-end; }
        h1 { font-size: 21px; letter-spacing: -.04em; }
        .studio-link { font-size: 11px; padding: 0 0 3px 0; }
        .player-surface { border-radius: 9px; }
        .chapters { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 13px; }
        .chapter { padding: 10px; flex-direction: row; align-items: baseline; gap: 8px; }
        .chapter-title { font-size: 11px; }
        .chapter-time { font-size: 10px; }
        .preview-footer { flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 14px; font-size: 10px; }
        .preview-footer p span { padding: 0 2px; }
        .format-note { font-size: 9px; }
      }
      @media (prefers-reduced-motion: reduce) { .chapter { transition: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>请启用 JavaScript 以播放 Prosio 品牌片。</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
